# ============================================================================
# Full local stack: PostgreSQL + Redis + the API.
#
#   docker compose up --build          # Docker
#   podman compose up --build          # Podman
#
# Then open http://localhost:3000/api/v1/docs
#
# The API waits for PostgreSQL to be genuinely ready, then applies migrations,
# seeds 600 listings, and serves.
# ============================================================================

name: automotive-marketplace

services:
  postgres:
    image: postgres:16-alpine
    container_name: amp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-marketplace}
      POSTGRES_PASSWORD: ${PGPASSWORD:-marketplace}
      POSTGRES_DB: ${PGDATABASE:-automotive_marketplace}
      # Deterministic collation keeps ORDER BY results identical across machines.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${PGPORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API must not start until PostgreSQL is genuinely accepting queries.
      test: ['CMD-SHELL', 'pg_isready -U ${PGUSER:-marketplace} -d ${PGDATABASE:-automotive_marketplace}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: amp-redis
    restart: unless-stopped
    # Append-only file off: Redis here only ever holds a 60-second cache, and a
    # container restart rebuilding it is cheaper than persisting it.
    #
    # Deliberately NOT `--save ""` (which also disables RDB snapshots): an empty
    # argv element is dropped by some compose implementations, leaving `--save`
    # to swallow the next flag and crash-loop Redis. RDB dumps still happen, but
    # they land in the container's own writable layer, not in a named volume, so
    # they disappear with the container.
    command: ['redis-server', '--appendonly', 'no']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amp-api
    restart: unless-stopped
    depends_on:
      postgres:
        # Hard requirement: without a database there is nothing to serve.
        condition: service_healthy
      redis:
        # Soft requirement. The API is explicitly designed to run without a
        # cache, so it waits only for Redis to be *started*, never for its
        # healthcheck. Waiting on `service_healthy` here would let a Redis
        # hiccup block the whole stack - the API would sit idle forever while
        # its dependency crash-looped.
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api/v1

      # Service DNS names from this compose network.
      DATABASE_URL: postgres://${PGUSER:-marketplace}:${PGPASSWORD:-marketplace}@postgres:5432/${PGDATABASE:-automotive_marketplace}
      DB_SSL: 'false'

      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: 'true'
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}

      # Override in a real deployment. Generate with:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-not-for-production}
      JWT_EXPIRES_IN: 7d

      CORS_ORIGIN: '*'
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}

      # Populate demo data on boot so the stack is usable immediately.
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_LISTINGS: ${SEED_LISTINGS:-600}
    ports:
      # Published as API_PORT, not PORT, on purpose. Compose substitutes
      # variables from the project's .env file, so using `PORT` here would make
      # the *host* port follow the app's own local dev setting - a developer with
      # PORT=3100 in .env would silently get the API on 3100 while the container
      # still listens on 3000, contradicting the README.
      - '${API_PORT:-3000}:3000'

volumes:
  pgdata:
    name: amp-pgdata
